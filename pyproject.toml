[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-kit"
version = "1.3.2"
description = "Local-first context toolkit for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
agentctx = "scripts.cli:main"
contextd = "scripts.cli:main"

[tool.setuptools]
py-modules = []
packages = ["scripts", "scripts.lib"]
